<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMDb Movie LiveSearch</title>
    <link rel="stylesheet" href="./styles/styles.css">
</head>

<body>
    <div class="container">
        <header class="header">
            <h1 class="header__title">Пошук фільмів</h1>
            <div class="search-box">
                <input type="text" class="search-box__input" placeholder="Введіть назву фільму (наприклад, Matrix)..."
                    autocomplete="off">
                <div class="search-box__loader search-box__loader--hidden"></div>
            </div>
        </header>

        <main class="main">
            <div class="error-message error-message--hidden"></div>
            <div class="movies"></div>
        </main>
    </div>

    <script src="./scripts/scripts.js"></script>
</body>

</html>
